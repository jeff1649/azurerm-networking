name: OIDC Control Plane Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-control-test:
    runs-on: ubuntu-latest
    environment: poc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login - Control Plane
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CONTROL_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Account
        run: az account show -o table

      - name: Verify Resource Group Access
        run: az group list -o table